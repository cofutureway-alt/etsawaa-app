# clamd for etsawaa-clamav (image defaults + larger scan limits:
# contact videos are up to 50 MB each, media uploads up to the admin limit)
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
StreamMaxLength 210M
MaxFileSize 210M
MaxScanSize 400M
ConcurrentDatabaseReload no
